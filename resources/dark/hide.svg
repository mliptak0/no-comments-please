<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Page background -->
  <rect x="2.5" y="0.8" width="10.5" height="13" rx="1.7" fill="#ffffff" stroke="#1a1a2e" stroke-width="1"/>
  <path d="M10.2 0.8 L13 3.9 L10.2 3.9 Z" fill="#e8e8ff" stroke="#1a1a2e" stroke-width="0.85" stroke-linejoin="round"/>
  <!-- Code lines -->
  <rect x="4.5" y="2.9" width="4.8" height="1.05" rx="0.52" fill="#1a1a2e" opacity="0.95"/>
  <rect x="4.5" y="4.7" width="4.2" height="1.05" rx="0.52" fill="#6d5dfc"/>
  <!-- Ghost mascot with pink blush and teal eye highlights, red slash -->
  <g transform="translate(4.8,7.5)">
    <ellipse cx="4" cy="4.3" rx="5.4" ry="4.7" fill="#ffffff" stroke="#1a1a2e" stroke-width="0.9"/>
    <!-- blush -->
    <ellipse cx="1.1" cy="4.4" rx="1" ry="0.65" fill="#ffb3d1" opacity="0.95"/>
    <ellipse cx="6.9" cy="4.4" rx="1" ry="0.65" fill="#ffb3d1" opacity="0.95"/>
    <!-- eyes with teal highlight -->
    <ellipse cx="2" cy="3.2" rx="1.25" ry="1.45" fill="#1a1a2e"/>
    <ellipse cx="6" cy="3.2" rx="1.25" ry="1.45" fill="#1a1a2e"/>
    <circle cx="2.35" cy="2.75" r="0.45" fill="#ffffff"/>
    <circle cx="6.35" cy="2.75" r="0.45" fill="#ffffff"/>
    <circle cx="2" cy="3.3" r="0.3" fill="#46ecd5"/>
    <circle cx="6" cy="3.3" r="0.3" fill="#46ecd5"/>
    <!-- slash through ghost -->
    <line x1="0.2" y1="7.6" x2="7.8" y2="0.2" stroke="#ff5a5f" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>